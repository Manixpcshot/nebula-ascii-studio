name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundles: nsis
          - os: ubuntu-24.04
            name: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2t64 patchelf
      - run: npm ci
      - name: Build installers
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} -- --locked
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - name: Set up Android SDK and NDK
        run: |
          sdkmanager "platforms;android-37" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build APK
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npm run tauri -- android build --ci --apk --target aarch64 x86_64
          else
            npm run tauri -- android build --ci --apk --debug --target aarch64 x86_64
          fi
      - name: Prepare installable APK
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          outputs=src-tauri/gen/android/app/build/outputs/apk
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            apk="$(find "$outputs" -name '*-debug.apk' -print -quit)"
            test -n "$apk"
            cp "$apk" "packages/Nebula-$version-android-debug.apk"
            exit
          fi
          apk="$(find "$outputs" -name '*-unsigned.apk' -print -quit)"
          test -n "$apk"
          test -n "$KEY_BASE64" && test -n "$KEY_PASSWORD" || {
            echo "::error::Set ANDROID_KEY_BASE64 and ANDROID_KEY_PASSWORD before tagging a release"
            exit 1
          }
          umask 077
          keystore="$RUNNER_TEMP/nebula-signing.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEY_BASE64" | base64 -d > "$keystore"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          output="packages/Nebula-$version-android.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias nebula \
            --ks-pass env:KEY_PASSWORD --out "$output" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "$output"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: packages/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Publish all platforms
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          cd packages
          shopt -s nullglob
          windows=(*.exe)
          deb=(*.deb)
          appimage=(*.AppImage)
          android=(*.apk)
          test "${#windows[@]}" -eq 1 && test "${#deb[@]}" -eq 1 && test "${#appimage[@]}" -eq 1 && test "${#android[@]}" -eq 1
          sha256sum *.exe *.deb *.AppImage *.apk > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.exe *.deb *.AppImage *.apk SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" *.exe *.deb *.AppImage *.apk SHA256SUMS.txt \
              --verify-tag --generate-notes --title "Nebula ASCII Studio $version" --repo "$GITHUB_REPOSITORY"
          fi
